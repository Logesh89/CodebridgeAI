services:
  # Backend FastAPI Web Service
  - type: web
    name: snaplogic-python-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SQLITE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # Frontend React Static Site
  - type: web
    name: snaplogic-python-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://snaplogic-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

